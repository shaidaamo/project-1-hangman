<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
    <title>Hangman Game</title>
<body>
    <h1>Hangman Game</h1>
    <h2 id="Guess">Guess The Word</h2>
    
    <p id="guesses-number">Mistakes Remianing :  &#128545; &#128544; &#128543; &#128531; &#128512; &#128513; </p>
    <img id="image" src="hangman1.png" alt="Hangman picture">
    <p id="Hidden-word">_ _ _ _ _</p>
    <h3 id="message">Message</h3>
    <div class="letters">
      <button id="A">A</button> <button id="B">B</button> <button id="C">C</button> <button id="D">D</button> 
      <button id="E">E</button> <button id="F">F</button><button id="G">G</button> <button id="H">H</button> 
      <button id="I">I</button><br> <button id="J">J</button> <button id="K">K</button> <button id="L">L</button> 
      <button id="M">M</button> <button id="N">N</button> <button id="O">O</button> <button id="P">P</button> 
      <button id="Q">Q</button> <button id="R">R</button><br><button id="S">S</button> <button id="T">T</button> 
      <button id="U">U</button><button id="V">V</button> <button id="W">W</button><button id="Y">Y</button> 
      <button id="Z">Z</button></div>
    <button id="Reset">Reset</button>
</body>
</html>
