<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
    <title>Hangman Game</title>
<body>
    <h1>The Hangman Game</h1>
    <h2 id="Guess">Guess The Word!</h2>
    <p id="timer">60</p>
    
    <h3 id="guesses-number">Mistakes Remianing :  6 </h3>
    <div id="Start"><button id="start">Start</button></div>
    <h2 id="message"></h2>
    <img id="image" src="./hangman1.png" alt="Hangman picture">
    <p id="hint"></p>
    <p class="Hidden-word"></p>
    
    
    <div class="letters">
      <button class="lett" id="A">A</button> <button  class="lett" id="B">B</button> <button   class="lett" id="C">C</button> <button  class="lett" id="D">D</button> 
      <button  class="lett" id="E">E</button> <button  class="lett" id="F">F</button><button  class="lett" id="G">G</button> <button  class="lett" id="H">H</button> 
      <button  class="lett" id="I">I</button><br> <button  class="lett" id="J">J</button> <button  class="lett" id="K">K</button> <button  class="lett" id="L">L</button> 
      <button  class="lett" id="M">M</button> <button  class="lett" id="N">N</button> <button  class="lett" id="O">O</button> <button  class="lett" id="P">P</button> 
      <button  class="lett" id="Q">Q</button> <button  class="lett" id="R">R</button><br><button  class="lett" id="S">S</button> <button  class="lett" id="T">T</button> 
      <button  class="lett" id="U">U</button><button  class="lett" id="V">V</button> <button  class="lett" id="W">W</button><button  class="lett" id="Y">Y</button> 
      <button  class="lett" id="Z">Z</button></div>
    <button id="Reset">Reset</button> <button id="Next">Next</button> <button id="pause">Pause</button>
</body>
</html>
